<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sundown Kennels</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:#0a0b0e; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.kg-app {
  /* ground + surfaces */
  --hide: #0a0b0e; --hide-deep: #06070a;
  --paper: #171a21;       /* raised panel / card face */
  --paper-dark: #12151b;  /* recessed field / inset */
  --raise: #212630;       /* hover surface */
  /* type */
  --ink: #e9ecf2; --ink-soft: #939bab;
  /* lines */
  --border: rgba(255,255,255,0.09); --metal: rgba(255,255,255,0.07); --stitch: rgba(255,255,255,0.05);
  /* brand — sundown */
  --accent: #ff8b3d; --accent-2: #ff5d5d; --accent-ink: #1b0f05;
  --accent-soft: rgba(255,139,61,0.13); --accent-line: rgba(255,139,61,0.32);
  /* semantic (names preserved — the game logic references these) */
  --olive: #3ddc97;   /* success / money  */
  --denim: #5fa8ff;   /* info / neutral   */
  --rust:  #ff6b6b;   /* danger / injury  */
  --tan-ink: #fbbf24; /* warning          */
  --gold:  #ffc94d;   /* highlight / rank */
  /* shape */
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -8px rgba(0,0,0,0.6);
  --shadow-lg: 0 2px 6px rgba(0,0,0,0.45), 0 24px 60px -18px rgba(0,0,0,0.8);

  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-feature-settings: 'cv05' 1, 'ss01' 1; -webkit-font-smoothing: antialiased;
  color: var(--ink);
  background:
    radial-gradient(900px 520px at 50% -180px, rgba(255,139,61,0.10), transparent 70%),
    radial-gradient(700px 500px at 100% 0%, rgba(255,93,93,0.06), transparent 65%),
    linear-gradient(180deg, #0c0e13 0%, var(--hide) 40%, var(--hide-deep) 100%);
  background-attachment: fixed;
  min-height: 100vh; padding: 22px 18px 56px;
}
.kg-app *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.kg-loading { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color: var(--ink-soft); min-height:100vh; font-family:'Inter',system-ui,sans-serif; }

/* ---------- header ---------- */
.kg-header { max-width: 1200px; margin: 0 auto; display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between; border-bottom: 1px solid var(--metal); padding-bottom: 16px; }
.kg-header__title { display:flex; align-items:center; gap:11px; }
.kg-header__title h1 {
  font-family:'Space Grotesk', 'Inter', sans-serif; font-weight:700; font-size: 27px; letter-spacing:-0.025em;
  margin:0; cursor:pointer; display:flex; align-items:center; gap:9px;
  background: linear-gradient(96deg, #ffffff 0%, #ffd9b8 44%, var(--accent) 78%, var(--accent-2) 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
}
.kg-header__logo { opacity:1; font-size:20px; color: var(--accent); -webkit-text-fill-color: var(--accent); background:none; -webkit-background-clip:border-box; background-clip:border-box; filter: drop-shadow(0 2px 6px rgba(255,139,61,0.4)); }
.kg-header__stats { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.kg-hstat { font-size: 12.5px; color: var(--ink-soft); font-weight:500; font-variant-numeric: tabular-nums; background: var(--paper); border:1px solid var(--border); border-radius: 999px; padding: 6px 13px; }
.kg-hstat--cash { color: var(--gold); border-color: rgba(255,201,77,0.28); background: rgba(255,201,77,0.09); font-weight:600; }

.kg-savewarn, .kg-notice { max-width:1200px; margin: 12px auto 0; font-size:12.5px; padding:11px 14px; border:1px solid; border-radius: var(--r-md); line-height:1.45; }
.kg-savewarn { background: rgba(255,107,107,0.09); border-color: rgba(255,107,107,0.3); color: #ffb0b0; }
.kg-notice { background: rgba(95,168,255,0.09); border-color: rgba(95,168,255,0.28); color: #a8ccff; }

/* ---------- shell ---------- */
.kg-layout { max-width: 1200px; margin: 20px auto 0; display:flex; align-items:flex-start; gap:20px; }
.kg-tabs { flex: 0 0 190px; display:flex; flex-direction:column; gap:3px; position:sticky; top:18px; }
.kg-tab {
  font-family:inherit; font-weight:500; background: transparent; border: 1px solid transparent;
  padding: 11px 14px; font-size: 13.5px; text-align:left; color: var(--ink-soft); cursor:pointer;
  border-radius: var(--r-sm); position:relative; transition: background 0.16s, color 0.16s;
}
.kg-tab:hover { background: rgba(255,255,255,0.045); color: var(--ink); }
.kg-tab--active { background: var(--accent-soft); color: #ffcfa8; font-weight:600; border-color: var(--accent-line); }
.kg-tab--active::before { content:""; position:absolute; left:0; top:50%; transform:translateY(-50%); width:3px; height:17px; border-radius:0 3px 3px 0; background: var(--accent); }
.kg-main { flex:1; min-width:0; background: var(--paper); border:1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 26px; }
@media (max-width: 860px) {
  .kg-layout { flex-direction: column; gap:14px; }
  .kg-tabs { flex-direction:row; overflow-x:auto; position:static; width:100%; flex:none; padding-bottom:4px; gap:6px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .kg-tabs::-webkit-scrollbar { display:none; }
  .kg-tabgroup { display:none; }
  .kg-tab { flex: 0 0 auto; border:1px solid var(--border); background: var(--paper-dark); }
  .kg-tab--active::before { display:none; }
  .kg-main { padding: 20px 16px; }
}

/* ---------- type ---------- */
.kg-hint { font-size:13px; color: var(--ink-soft); margin: 0 0 18px; line-height:1.55; }
.kg-subhead { font-family:'Space Grotesk','Inter',sans-serif; font-weight:600; font-size:19px; margin: 2px 0 16px; letter-spacing:-0.02em; color: var(--ink); }
.kg-empty { color: var(--ink-soft); font-size:13.5px; padding: 40px 0; text-align:center; }
.kg-note { font-size:12.5px; color: var(--denim); margin: 7px 0; }

/* ---------- fields ---------- */
.kg-search, .kg-onboard__input, .kg-cloud__panel input, .kg-pairpick select, .kg-pairpick input,
.kg-filters select, .kg-filters input, .kg-rename input {
  font-family:inherit; color: var(--ink); background: var(--paper-dark);
  border:1px solid var(--border); border-radius: var(--r-sm);
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
}
.kg-search:focus, .kg-onboard__input:focus, .kg-cloud__panel input:focus, .kg-pairpick select:focus,
.kg-pairpick input:focus, .kg-filters select:focus, .kg-filters input:focus, .kg-rename input:focus {
  outline:none; border-color: var(--accent-line); background: #161a21;
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.kg-search::placeholder, .kg-onboard__input::placeholder, input::placeholder { color: #6b7280; }
.kg-search { width:100%; font-size:13.5px; padding:11px 13px; margin-bottom:16px; }

.kg-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap:14px; }

/* ---------- overview ---------- */
.kg-ovstats { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:12px; margin-bottom:22px; }
.kg-ovstat { background: var(--paper-dark); border:1px solid var(--border); border-radius: var(--r-md); padding:15px 16px; transition: border-color 0.18s; }
.kg-ovstat:hover { border-color: rgba(255,255,255,0.15); }
.kg-ovstat__label { font-size:10.5px; text-transform:uppercase; letter-spacing:0.09em; color: var(--ink-soft); font-weight:600; }
.kg-ovstat__value { font-family:'Space Grotesk','Inter',sans-serif; font-weight:600; font-size:25px; margin-top:5px; letter-spacing:-0.03em; font-variant-numeric: tabular-nums; }
.kg-ovpanel { background: var(--paper-dark); border:1px solid var(--border); border-radius: var(--r-md); padding:18px; margin-bottom:20px; }
.kg-spark { display:block; overflow:visible; }
.kg-ovgrid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
@media (max-width: 700px) { .kg-ovgrid { grid-template-columns: 1fr; } }
.kg-quickactions { display:flex; gap:9px; flex-wrap:wrap; margin-top:16px; }
.kg-offers { display:flex; flex-direction:column; gap:10px; }
.kg-offer { background: var(--paper); border:1px solid var(--border); border-radius: var(--r-sm); padding:12px 14px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; }
.kg-offer p { margin:0; font-size:13px; flex:1; min-width:200px; line-height:1.5; }
.kg-offer__actions { display:flex; gap:7px; }
.kg-offer__actions .kg-btn { width:auto; }

/* ---------- dog card ---------- */
.kg-card {
  position:relative; background: var(--paper-dark); border:1px solid var(--border); border-radius: var(--r-md);
  padding: 16px 15px 14px; transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}
.kg-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.16); box-shadow: var(--shadow); }
.kg-card::before, .kg-card::after { content:none; }
.kg-seal { flex: 0 0 auto; width:27px; height:27px; border-radius:50%; border:1px solid; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; background: rgba(255,255,255,0.04); }
.kg-seal--gold { border-color: rgba(255,201,77,0.45); color: var(--gold); background: rgba(255,201,77,0.11); }
.kg-seal--olive { border-color: rgba(61,220,151,0.45); color: var(--olive); background: rgba(61,220,151,0.11); }
.kg-seal--denim { border-color: rgba(95,168,255,0.45); color: var(--denim); background: rgba(95,168,255,0.11); }
.kg-seal--rust { border-color: rgba(255,107,107,0.45); color: var(--rust); background: rgba(255,107,107,0.11); }
.kg-card__stamp { position:absolute; top:13px; right:13px; max-width:112px; font-size:9.5px; font-weight:600; letter-spacing:0.07em; color: var(--denim); border:1px solid rgba(95,168,255,0.3); background: rgba(95,168,255,0.1); border-radius:999px; padding:3px 8px; text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.kg-card__swatch { display:block; margin: 6px 0 10px; border:1px solid var(--border); border-radius: var(--r-sm); }
.kg-card__top { display:flex; align-items:center; justify-content:space-between; gap:8px; padding-right:56px; }
.kg-card__name { font-family:'Space Grotesk','Inter',sans-serif; font-weight:600; font-size:15.5px; letter-spacing:-0.015em; margin:0; display:flex; align-items:center; gap:6px; }
.kg-card__breed { font-size:12px; color: var(--ink-soft); margin:4px 0 0; font-style:normal; }
.kg-card__meta { font-size:11.5px; color: var(--ink-soft); margin: 3px 0 10px; font-variant-numeric: tabular-nums; }
.kg-card__tags { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px; }
.kg-card__stats { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
.kg-card__health { display:flex; align-items:center; gap:7px; color: var(--rust); margin-bottom: 10px; font-size:12px; }
.kg-card__price { font-weight:600; color: var(--olive); margin: 0 0 10px; font-size:14px; font-variant-numeric: tabular-nums; }
.kg-card__footer { margin-top: 8px; display:flex; flex-direction:column; gap:7px; }

.kg-statrow { display:grid; grid-template-columns: 84px 1fr 26px; align-items:center; gap:8px; }
.kg-statlabel { font-size:10.5px; color: var(--ink-soft); }
.kg-statbar { height:5px; background: rgba(255,255,255,0.08); border-radius:999px; overflow:hidden; }
.kg-statbar--health { flex:1; height:5px; }
.kg-statfill { height:100%; border-radius:999px; transition: width 0.4s ease; }
.kg-statval { font-size:10.5px; text-align:right; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* ---------- badges ---------- */
.kg-badge { font-size:10px; text-transform:uppercase; letter-spacing:0.07em; font-weight:600; padding: 3px 9px; border:1px solid; border-radius:999px; white-space:nowrap; }
.kg-badge--olive { color: var(--olive); border-color: rgba(61,220,151,0.3); background: rgba(61,220,151,0.1); }
.kg-badge--rust { color: var(--rust); border-color: rgba(255,107,107,0.3); background: rgba(255,107,107,0.1); }
.kg-badge--denim { color: var(--denim); border-color: rgba(95,168,255,0.3); background: rgba(95,168,255,0.1); }
.kg-badge--tan { color: var(--tan-ink); border-color: rgba(251,191,36,0.3); background: rgba(251,191,36,0.1); }
.kg-badge--gold { color: var(--gold); border-color: rgba(255,201,77,0.35); background: rgba(255,201,77,0.13); text-transform:none; letter-spacing:0.01em; }

/* ---------- buttons ---------- */
.kg-btn {
  font-family:inherit; font-weight:600; font-size:12.5px; letter-spacing:0.03em; text-transform:uppercase;
  background: linear-gradient(180deg, #ff9950 0%, var(--accent) 55%, #f5762c 100%); color: var(--accent-ink);
  border: 1px solid rgba(0,0,0,0.28); border-radius: var(--r-sm); padding: 11px 16px; cursor:pointer;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 2px 10px -2px rgba(255,139,61,0.45);
  transition: filter 0.15s, transform 0.08s, box-shadow 0.15s, opacity 0.15s;
}
.kg-btn:hover:not(:disabled) { filter: brightness(1.07); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 4px 16px -2px rgba(255,139,61,0.55); }
.kg-btn:active:not(:disabled) { transform: translateY(1px); filter: brightness(0.96); }
.kg-btn:disabled { background: var(--raise); color: var(--ink-soft); border-color: var(--border); opacity:0.65; cursor:not-allowed; box-shadow:none; filter:none; }

.kg-btn--sm { padding: 9px 12px; font-size:11.5px; width:100%; background: var(--raise); color: var(--ink); border:1px solid var(--border); box-shadow:none; }
.kg-btn--sm:hover:not(:disabled) { background: #2a3039; border-color: rgba(255,255,255,0.18); filter:none; box-shadow:none; }

.kg-btn--ghost { background:transparent; border:1px solid var(--border); color: var(--ink-soft); box-shadow:none; }
.kg-btn--ghost:hover:not(:disabled) { background: rgba(255,255,255,0.05); color: var(--ink); border-color: rgba(255,255,255,0.18); filter:none; box-shadow:none; }

.kg-btn--danger { background: rgba(255,107,107,0.14); color: #ff8f8f; border:1px solid rgba(255,107,107,0.35); box-shadow:none; }
.kg-btn--danger:hover:not(:disabled) { background: rgba(255,107,107,0.22); color:#ffb3b3; filter:none; box-shadow:none; }

.kg-btn--gold { background: linear-gradient(180deg, #ffd66b 0%, var(--gold) 55%, #eaa81f 100%); color: #241802; border-color: rgba(0,0,0,0.28); box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 2px 10px -2px rgba(255,201,77,0.45); }

/* ---------- cloud save ---------- */
.kg-cloud { position:relative; }
.kg-cloud__panel { position:absolute; top: calc(100% + 10px); right:0; z-index:20; width:280px; background: #1a1e26; color: var(--ink); border: 1px solid var(--border); box-shadow: var(--shadow-lg); padding:18px; border-radius: var(--r-md); }
.kg-cloud__panel h3 { margin:0 0 5px; font-family:'Space Grotesk','Inter',sans-serif; font-weight:600; font-size:16px; letter-spacing:-0.02em; }
.kg-cloud__panel p { margin:0 0 12px; font-size:12.5px; color: var(--ink-soft); line-height:1.5; }
.kg-cloud__panel input { width:100%; font-size:13px; padding:10px 12px; margin-bottom:9px; }
.kg-cloud__row { display:flex; gap:8px; }
.kg-cloud__row .kg-btn { flex:1; }
.kg-cloud__switch { background:none; border:none; color: var(--denim); font-size:12px; cursor:pointer; padding:10px 0 0; font-family:inherit; font-weight:500; }
.kg-cloud__switch:hover { color:#8cc0ff; text-decoration:underline; }
.kg-cloud__msg { font-size:12px; color: var(--rust); margin-top:8px; }
.kg-cloud__status { font-size:10px; text-transform:uppercase; letter-spacing:0.08em; opacity:0.7; font-weight:600; }

.kg-iconbtn { border:none; background:transparent; cursor:pointer; color: var(--ink-soft); padding:3px; display:inline-flex; font-size:12px; border-radius:5px; transition: color 0.15s, background 0.15s; }
.kg-iconbtn--ghost { opacity:0.45; }
.kg-iconbtn:hover { color: var(--ink); background: rgba(255,255,255,0.07); opacity:1; }
.kg-rename { display:flex; align-items:center; gap:5px; }
.kg-rename input { font-size:13px; padding:5px 8px; width:130px; }

/* ---------- hunting ---------- */
.kg-hunttypes { display:grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap:11px; margin-bottom: 24px; }
.kg-huntcard, .kg-trialcard {
  text-align:left; background: var(--paper-dark); border:1px solid var(--border); border-radius: var(--r-md);
  padding:14px; cursor:pointer; display:flex; flex-direction:column; gap:5px; font-family:inherit; color: var(--ink);
  transition: background 0.16s, border-color 0.16s, transform 0.12s;
}
.kg-huntcard:hover, .kg-trialcard:hover { border-color: rgba(255,255,255,0.17); background: #171b22; transform: translateY(-2px); }
.kg-huntcard strong, .kg-trialcard strong { font-family:'Space Grotesk','Inter',sans-serif; font-weight:600; font-size:14px; letter-spacing:-0.01em; }
.kg-huntcard span, .kg-trialcard span { font-size:11.5px; color: var(--ink-soft); line-height:1.45; }
.kg-huntcard__meta { color: var(--denim) !important; }
.kg-huntcard--active, .kg-trialcard--active { border-color: var(--accent-line); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent-line); }

/* ---------- breeding ---------- */
.kg-pairpick { display:flex; gap:11px; flex-wrap:wrap; margin-bottom: 20px; }
.kg-pairpick select, .kg-pairpick input { font-size:13.5px; padding:11px 12px; min-width: 220px; flex:1; }
.kg-preview { background: var(--paper-dark); border:1px solid var(--border); border-radius: var(--r-md); padding: 18px; max-width:460px; margin-bottom: 28px; }
.kg-preview h3 { font-family:'Space Grotesk','Inter',sans-serif; font-weight:600; font-size:15px; margin: 0 0 6px; letter-spacing:-0.015em; }
.kg-warn { color: var(--rust); font-size:12.5px; margin: 8px 0; line-height:1.5; }
.kg-divider { border:none; border-top:1px solid var(--metal); margin: 28px 0 22px; }

/* ---------- market ---------- */
.kg-marketbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
.kg-filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; background: var(--paper-dark); border:1px solid var(--border); border-radius: var(--r-md); padding:14px; }
.kg-filters select, .kg-filters input { font-size:12.5px; padding:8px 10px; }
.kg-filters label { display:flex; flex-direction:column; gap:5px; font-size:10px; color: var(--ink-soft); text-transform:uppercase; letter-spacing:0.08em; font-weight:600; }
.kg-filters input[type="number"] { width:96px; }

/* ---------- log ---------- */
.kg-log { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.kg-logrow { display:flex; gap:12px; font-size:12.5px; padding: 10px 13px; border-left: 2px solid var(--border); background: var(--paper-dark); border-radius: 0 var(--r-sm) var(--r-sm) 0; line-height:1.5; }
.kg-logrow--money { border-color: var(--olive); }
.kg-logrow--injury { border-color: var(--rust); }
.kg-logrow--breed { border-color: var(--denim); }
.kg-logrow--hunt { border-color: var(--tan-ink); }
.kg-logrow--catch { border-color: var(--gold); }
.kg-logday { color: var(--ink-soft); white-space:nowrap; font-weight:600; font-variant-numeric: tabular-nums; }
.kg-logrank { color: var(--gold); font-weight:700; white-space:nowrap; }

.kg-bloodline { background: var(--paper-dark); border:1px solid var(--border); border-radius: var(--r-md); padding: 16px; margin-bottom: 12px; }
.kg-bloodline h3 { font-family:'Space Grotesk','Inter',sans-serif; font-weight:600; font-size:15px; margin: 0 0 7px; letter-spacing:-0.015em; }

/* ---------- onboarding ---------- */
.kg-onboard { max-width: 660px; margin: 8vh auto 40px; }
.kg-onboard__hero { text-align:center; margin-bottom: 28px; }
.kg-onboard__hero h1 {
  font-family:'Space Grotesk','Inter',sans-serif; font-weight:700; font-size: clamp(38px, 7vw, 54px); letter-spacing:-0.04em; margin: 0 0 12px; line-height:1.05;
  background: linear-gradient(96deg, #ffffff 0%, #ffd9b8 40%, var(--accent) 72%, var(--accent-2) 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
}
.kg-onboard__hero h1 .kg-header__logo { font-size:0.78em; }
.kg-onboard__hero p { color: var(--ink-soft); font-size:14.5px; margin:0 auto; max-width:46ch; line-height:1.6; }
.kg-onboard__card { background: var(--paper); border:1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); padding: 30px 28px; }
.kg-onboard__step { font-size:10.5px; text-transform:uppercase; letter-spacing:0.14em; color: var(--accent); font-weight:700; margin: 0 0 8px; }
.kg-onboard__title { font-family:'Space Grotesk','Inter',sans-serif; font-weight:600; font-size:24px; margin: 0 0 10px; letter-spacing:-0.03em; }
.kg-onboard__input { width:100%; font-size:16px; padding:14px 15px; margin-bottom:16px; }

/* Apply a purchased item to a dog. Returns the updated dog plus a log line.
   Training gains are capped at 100 and scale with the Training Yard upgrade. */
function applyItem(dog, itemId, upgrades) {
  const item = ITEMS[itemId];
  if (!item) return { dog, msg: null, ok: false };
  const up = upgrades || {};
  const next = { ...dog, stats: { ...dog.stats } };

  if (item.collar) {
    next.collar = item.collar;
    next.collarName = item.name;
    return { dog: next, ok: true, msg: `${dog.name} is wearing a ${item.name.toLowerCase()}.` };
  }

  if (item.heal) {
    next.health = 100;
    return { dog: next, ok: true, msg: `${dog.name} got a full workup and came back sound.` };
  }

  const gains = [];
  if (item.stat) {
    const bonus = up.trainingYard && item.cat === "training" ? 1 : 0;

    if (h < 0 && up.trainingYard) h = Math.round(h * 0.6);

/* Rescues are cheap, unpapered, and beat up — but the genetics are a coin flip
   and occasionally you pull a very good dog out of the pen for $200. */
function generateRescueDog(day) {
  const dog = generateRandomDog();
  dog.health = randInt(28, 68);
  dog.registered = false;
  dog.ageDays = randInt(200, 1500);
  dog.hiddenColor = null;
  dog.hiddenPattern = null;

    id: "r" + dog.id,

/* ------------------------------- rankings -------------------------------- */

/* Kennels are scored on a blend of the things the game actually rewards:
   fame, the quality of the best dogs, and depth of the yard. */
function kennelScore({ fame, dogs }) {
  if (!dogs || !dogs.length) return Math.round(fame || 0);
  const rated = dogs.map((d) => overallRating(d.stats)).sort((a, b) => b - a);
  const best = rated[0] || 0;
  const topThree = rated.slice(0, 3).reduce((a, b) => a + b, 0) / Math.min(3, rated.length);
  return Math.round((fame || 0) * 1.6 + best * 2 + topThree * 1.5 + dogs.length * 4);
}

function buildRankings(state) {
  const rows = Object.values(state.aiKennels || {}).map((k) => {
    const dogs = k.dogs || [];
    // AI kennels don't track fame directly — infer it from the yard so the
    // tier labels actually spread out instead of all reading "Unknown".
    const best = dogs.length ? Math.max(...dogs.map((d) => overallRating(d.stats))) : 0;
    const inferred = Math.max(0, Math.round((best - 52) * 3.4 + dogs.length * 5));
    return { id: k.id, name: k.name, dogs, fame: typeof k.fame === "number" ? k.fame : inferred, isPlayer: false };
  });
  rows.push({ id: "player", name: state.kennelName, dogs: state.dogs, fame: state.fame || 0, isPlayer: true });
  return rows
    .map((r) => ({
      ...r,
      score: kennelScore(r),
      bestDog: (r.dogs || []).slice().sort((a, b) => overallRating(b.stats) - overallRating(a.stats))[0] || null,
    }))
    .sort((a, b) => b.score - a.score);
}

  if (typeof out.fame !== "number") out.fame = 0;
  if (!Array.isArray(out.socialFeed)) out.socialFeed = [];
  return out;
}

const STORAGE_KEY = "kennel-save-v7";
const THEME_KEY = "kennel-theme";

/* --------------------------------- pieces --------------------------------- */

function StatBar({ label, value }) {
  const pct = clamp(value);
  const tone = pct >= 75 ? "var(--olive)" : pct >= 45 ? "var(--denim)" : "var(--rust)";
  return (
    <div className="kg-statrow">
      <span className="kg-statlabel">{label}</span>
      <div className="kg-statbar"><div className="kg-statfill" style={{ width: pct + "%", background: tone }} /></div>
      <span className="kg-statval">{pct}</span>
    </div>
  );
}
function Badge({ tone, children }) { return <span className={"kg-badge kg-badge--" + tone}>{children}</span>; }

/* Hand-inked ledger line — plots net worth over time from the kennel's own
   recorded history, no external chart library. */
function Sparkline({ points, width = 640, height = 140 }) {
  if (!points || points.length < 2) return <p className="kg-empty">Not enough history yet — keep playing and the line will fill in.</p>;
  const values = points.map((p) => p.netWorth);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const stepX = width / (points.length - 1);
  const coords = points.map((p, i) => [Math.round(i * stepX * 10) / 10, Math.round((height - 8 - ((p.netWorth - min) / range) * (height - 20)) * 10) / 10]);
  const line = coords.map((c) => c.join(",")).join(" ");
  const area = `0,${height} ` + line + ` ${width},${height}`;
  return (
    <svg className="kg-spark" viewBox={`0 0 ${width} ${height}`} width="100%" height={height} preserveAspectRatio="none">
      <polygon points={area} fill="var(--olive)" opacity="0.12" />
      <polyline points={line} fill="none" stroke="var(--olive)" strokeWidth="2" />
      {coords.length && <circle cx={coords[coords.length - 1][0]} cy={coords[coords.length - 1][1]} r="3.5" fill="var(--gold)" />}
    </svg>
  );
}

/* The through-line signature element: a rubber-stamped rating seal, same
   device used for the breed stamp and papers, now doing double duty as an
   at-a-glance quality mark on every card. */
function RatingSeal({ rating }) {
  const tone = rating >= 80 ? "gold" : rating >= 65 ? "olive" : rating >= 45 ? "denim" : "rust";
  return <div className={"kg-seal kg-seal--" + tone}>{rating}</div>;
}

/* A procedurally generated coat swatch — not a photoreal AI image (no image
   model is available in this environment), but a genuinely generated strip
   built from the dog's actual base color + pattern genes, seeded on its id
   so it's stable every time you look at it. */
function CoatSwatch({ dog, width = 200, height = 26 }) {
  const rng = mulberry32(hashStr(dog.id));
  const baseHex = COLOR_HEX[dog.colorGenes.base] || COLOR_HEX.fawn;
  const darker = shade(baseHex, -30);
  const lighter = shade(baseHex, 26);
  const pattern = dog.colorGenes.pattern;
  const shapes = [];
  if (pattern === "brindle") {
    for (let i = 0; i < 14; i++) {
      const x = rng() * width;
      shapes.push(<rect key={i} x={x} y={-4} width={2.5 + rng() * 3} height={height + 8} fill={darker} opacity="0.6" transform={`rotate(22 ${x} ${height / 2})`} />);
    }
  } else if (pattern === "merle") {
    const patchFill = dog.colorGenes.merleAlleles === 2 ? "#ece4d3" : darker;
    const count = dog.colorGenes.merleAlleles === 2 ? 11 : 7;
    for (let i = 0; i < count; i++) {
      const cx = rng() * width, cy = rng() * height, r = 5 + rng() * 9;
      shapes.push(<ellipse key={i} cx={cx} cy={cy} rx={r} ry={r * 0.7} fill={patchFill} opacity={dog.colorGenes.merleAlleles === 2 ? 0.6 : 0.5} />);
    }
  } else if (pattern === "piebald") {
    for (let i = 0; i < 5; i++) {
      const cx = rng() * width, cy = rng() * height, r = 9 + rng() * 14;
      shapes.push(<ellipse key={i} cx={cx} cy={cy} rx={r} ry={r * 0.75} fill={COLOR_HEX.white} opacity="0.92" />);
    }
  } else if (pattern === "saddle") {
    shapes.push(<rect key="s" x={width * 0.32} y={0} width={width * 0.36} height={height} fill={darker} opacity="0.88" />);
  } else if (pattern === "tricolor") {
    shapes.push(<rect key="w" x={0} y={0} width={width} height={height} fill={COLOR_HEX.white} />);
    shapes.push(<rect key="a" x={0} y={0} width={width * 0.4} height={height} fill={baseHex} />);
    shapes.push(<rect key="b" x={width * 0.6} y={0} width={width * 0.4} height={height} fill={shade(baseHex, 20)} />);
  } else if (pattern === "ticked") {
    shapes.push(<rect key="w" x={0} y={0} width={width} height={height} fill={COLOR_HEX.white} />);
    for (let i = 0; i < 70; i++) {
      const cx = rng() * width, cy = rng() * height;
      shapes.push(<circle key={i} cx={cx} cy={cy} r={1.1 + rng()} fill={baseHex} opacity="0.75" />);
    }
  }
  return (
    <svg className="kg-card__swatch" width="100%" viewBox={`0 0 ${width} ${height}`} height={height} preserveAspectRatio="none">
      <rect x="0" y="0" width={width} height={height} fill={pattern === "tricolor" || pattern === "ticked" ? "none" : baseHex} />
      {shapes}
    </svg>
  );
}

function DogCard({ dog, price, sellerName, footer, onView }) {
  const st = statusOf(dog);
  const rarity = computeRarity(dog);
  const star = starTrait(dog);
  const bc = bullyClass(dog);
  const grade = conformationGrade(dog);
  return (
    <div className="kg-card">
      <div className="kg-card__stamp">{breedShort(dog.breed)}</div>
      {dog.rescued && <div className="kg-card__rescue" title="Shelter dog">♥</div>}
      <div className="kg-card__coat">
        <CoatSwatch dog={dog} />
        {dog.collar && <span className="kg-card__collar" style={{ background: dog.collar }} title={dog.collarName || "Collar"} />}
      </div>
      <div className="kg-card__top">
        <h3 className="kg-card__name" style={onView ? { cursor: "pointer", textDecoration: "underline", textDecorationStyle: "dotted" } : null} onClick={onView ? () => onView(dog) : undefined}>
          {dog.sex === "M" ? "♂" : "♀"} {dog.name}
        </h3>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <RatingSeal rating={overallRating(dog.stats)} />
          <Badge tone={st.tone}>{st.label}</Badge>
        </div>
      </div>
      <p className="kg-card__breed">{dog.breed} · {colorLabel(dog.colorGenes)}</p>
      <p className="kg-card__meta">
        {ageLabel(dog.ageDays)} old · {dog.heightIn}in · {dog.weightLb}lb · Gen {dog.generation}{dog.sire ? " · out of " + dog.sire + " × " + dog.dam : ""}{sellerName ? " · " + sellerName : ""}
      </p>
      <div className="kg-card__tags">
        <Badge tone={rarity.tone}>{rarity.tier}</Badge>
        <Badge tone={grade.tone}>Grade {grade.grade}</Badge>
        {dog.culled && <Badge tone="rust">Below Standard</Badge>}
        {star.stars >= 3 && <Badge tone="gold">{starString(star.stars)} {STAT_LABELS[star.key]}</Badge>}
        {isBandogBreed(dog.breed) && <Badge tone="rust">{dog.breed === "Bandog" ? "Bandog" : dog.breed}</Badge>}
        {bc && <Badge tone={bc.key === "xxl" ? "gold" : bc.key === "xl" ? "rust" : bc.key === "pocket" ? "tan" : "denim"}>{bc.label}</Badge>}
        {dog.crossBred && dog.breed !== "Bandog" && <Badge tone="denim">Hybrid Vigor</Badge>}
        {dog.mstnAlleles === 1 && <Badge tone="rust">Muscled (MSTN)</Badge>}
        {dog.mstnAlleles === 2 && <Badge tone="rust">Double Muscled</Badge>}
        {dog.grewBigger && <Badge tone="gold">Growth Mutation</Badge>}
        {(dog.traits || []).map((k) => <Badge key={k} tone={TRAIT_DEFS[k].tone}>{TRAIT_DEFS[k].name}</Badge>)}
        {dog.impaired && <Badge tone="rust">⚠ {dog.breed === "Dogo Argentino" ? "Hearing Impaired" : "Double Merle"}</Badge>}
        {dog.registered && <Badge tone="gold">Papers {dog.regNumber}</Badge>}
        {dog.bloodline && <Badge tone="denim">{dog.bloodline} Line</Badge>}
      </div>
      {(dog.hiddenColor || dog.hiddenPattern || (dog.hiddenTraits && dog.hiddenTraits.length > 0)) && (
        <p className="kg-hint" style={{ margin: "0 0 8px" }}>
          Carries: {[dog.hiddenColor && cap(dog.hiddenColor) + " (color)", dog.hiddenPattern && cap(dog.hiddenPattern) + " (pattern)", ...(dog.hiddenTraits || []).map((k) => TRAIT_DEFS[k].name)].filter(Boolean).join(", ")} — may surface in pups
        </p>
      )}
      <div className="kg-card__stats">{STAT_KEYS.map((k) => <StatBar key={k} label={STAT_LABELS[k]} value={dog.stats[k]} />)}</div>
      <div className="kg-card__health">
        <span>♥</span>
        <div className="kg-statbar kg-statbar--health"><div className="kg-statfill" style={{ width: clamp(dog.health) + "%", background: dog.health >= 60 ? "var(--olive)" : dog.health >= 35 ? "var(--tan-ink)" : "var(--rust)" }} /></div>
        <span className="kg-statval">{Math.round(dog.health)}</span>
      </div>
      {price != null && <p className="kg-card__price">${price.toLocaleString("en-US")}</p>}
      {footer && <div className="kg-card__footer">{footer}</div>}
    </div>
  );
}

/* Renders as far back as the game actually knows — pedigree is snapshotted
   at breeding time, so it goes back exactly as many generations as you've
   bred toward, and stops honestly at "Unknown" for bought/scouted/founder
   stock rather than making anything up. */
function PedigreeBranch({ role, entry, depth, maxDepth }) {
  return (
    <div className="kg-pednode">
      <div className="kg-pednode__row">
        <span className="kg-pednode__role">{role}</span>
        {entry ? (
          <span className="kg-pednode__name">{entry.name} <span className="kg-pednode__meta">— {entry.breed}, {colorLabel(entry.colorGenes)}{entry.bloodline ? ", " + entry.bloodline + " Line" : ""}{entry.regNumber ? ", " + entry.regNumber : ""}</span></span>
        ) : (
          <span className="kg-pednode__unknown">Unknown — foundation stock</span>
        )}
      </div>
      {entry && entry.pedigree && depth < maxDepth && (
        <div className="kg-pednode__children">
          <PedigreeBranch role="Sire" entry={entry.pedigree.sire} depth={depth + 1} maxDepth={maxDepth} />
          <PedigreeBranch role="Dam" entry={entry.pedigree.dam} depth={depth + 1} maxDepth={maxDepth} />
        </div>
      )}
      {entry && entry.pedigree && depth >= maxDepth && <div className="kg-pednode__unknown" style={{ marginLeft: 16 }}>…earlier generations on file, not shown here</div>}
    </div>
  );
}
function FamilyTree({ dog }) {
  if (!dog.pedigree) return <p className="kg-empty">No ancestry on record — {dog.name} is foundation stock (bought, scouted, or an original founder).</p>;
  return (
    <div className="kg-pedtree">
      <div className="kg-pedroot">{dog.sex === "M" ? "♂" : "♀"} {dog.name} — Gen {dog.generation}</div>
      <PedigreeBranch role="Sire" entry={dog.pedigree.sire} depth={1} maxDepth={4} />
      <PedigreeBranch role="Dam" entry={dog.pedigree.dam} depth={1} maxDepth={4} />
    </div>
  );
}

/* Shown right after a litter is whelped — the player picks which pups to
   keep (capped by remaining kennel space). Anything not picked goes to a
   pet home for half its value rather than vanishing outright. */
function LitterPicker({ litter, selectedIds, onToggle, onConfirm }) {
  if (!litter) return null;
  const { pups, room, note, label } = litter;
  const atLimit = selectedIds.length >= room;
  return (
    <div className="kg-modal-backdrop">
      <div className="kg-modal" style={{ maxWidth: 760 }} onClick={(e) => e.stopPropagation()}>
        <div className="kg-modal__head">
          <h2>🐾 New litter — {label}</h2>
          <p className="kg-hint">
            {room === 0
              ? "Your kennel's full — every pup here will go to a pet home for half value."
              : `Pick up to ${room} pup${room === 1 ? "" : "s"} to keep (your kennel has room for ${room} more). The rest go to pet homes at half value.`}
          </p>
          {note && <p className="kg-note">{note}</p>}
        </div>
        <div className="kg-grid">
          {pups.map((p) => {
            const picked = selectedIds.includes(p.id);
            return (
              <DogCard key={p.id} dog={p}
                footer={room === 0 ? <span className="kg-empty">Pet home — {fmtMoney(Math.round(computeValue(p) * 0.5))}</span> : (
                  <button className={"kg-btn kg-btn--sm " + (picked ? "" : "kg-btn--ghost")} disabled={!picked && atLimit} onClick={() => onToggle(p.id)}>
                    {picked ? "✓ Keeping" : atLimit ? "No room left" : "Keep this pup"}
                  </button>
                )} />
            );
          })}
        </div>
        <button className="kg-btn kg-btn--gold" style={{ marginTop: 16, width: "auto" }} onClick={onConfirm}>
          {room === 0 ? "Continue" : `Confirm — keep ${selectedIds.length}`}
        </button>
      </div>
    </div>
  );
}

        <h3 className="kg-modal__section">Genetics</h3>

          <li>Hidden color gene: {dog.hiddenColor ? cap(dog.hiddenColor) : "none known"}</li>
          <li>Hidden pattern gene: {dog.hiddenPattern ? cap(dog.hiddenPattern) : "none known"}</li>
        </ul>

        <h3 className="kg-modal__section">Physical Traits</h3>
        {(dog.traits && dog.traits.length) || dog.mstnAlleles ? (
          <ul className="kg-modal__facts" style={{ gap: 10 }}>
            {dog.mstnAlleles === 1 && <li><strong>{TRAIT_DEFS.myostatin1.name}</strong> — {TRAIT_DEFS.myostatin1.desc}</li>}
            {dog.mstnAlleles === 2 && <li><strong>{TRAIT_DEFS.myostatin2.name}</strong> — {TRAIT_DEFS.myostatin2.desc}</li>}
            {(dog.traits || []).map((k) => (
              <li key={k}><strong>{TRAIT_DEFS[k].name}</strong> — {TRAIT_DEFS[k].desc}{TRAIT_DEFS[k].real === false && <em style={{ color: "var(--ink-soft)" }}> (gameplay trait, not a single named gene)</em>}</li>
            ))}
          </ul>
        ) : <p className="kg-empty">No standout physical traits — an even, unremarkable specimen for the breed.</p>}
        {(dog.hiddenTraits && dog.hiddenTraits.length > 0) && (
          <p className="kg-note">Also carries hidden: {dog.hiddenTraits.map((k) => TRAIT_DEFS[k].name).join(", ")} — not expressed in this dog, but can surface in pups.</p>
        )}

        <h3 className="kg-modal__section">Family Tree</h3>
        <ul className="kg-modal__facts" style={{ marginBottom: 10 }}>
          <li>Registration: {dog.registered ? dog.regNumber : "unregistered"}</li>
          <li>Bloodline: {dog.bloodline ? dog.bloodline + " Line" : "none"}</li>
        </ul>
        <FamilyTree dog={dog} />
      </div>
    </div>
  );
}

/* Cloud save widget: sign in / sign up / sign out, shared between the
   setup screen (so a returning player can pull their cloud kennel before
   founding a new local one) and the main game header. */
function CloudAuthPanel(props) {
  const {
    session, cloudStatus, open, onToggle,
    authMode, setAuthMode, authEmail, setAuthEmail, authPassword, setAuthPassword,
    authMsg, onSubmit, onSignOut,
  } = props;

  return (
    <div className="kg-cloud">
      <button className="kg-btn kg-btn--ghost kg-btn--sm" style={{ width: "auto" }} onClick={onToggle}>

      </button>
      {open && (
        <div className="kg-cloud__panel">
          {session ? (
            <React.Fragment>
              <h3>Cloud Save</h3>
              <p>Signed in as {session.user.email}. Your kennel autosaves here.</p>

              <input type="password" placeholder="Password" required minLength={6} value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} />
              <div className="kg-cloud__row">
                <button type="submit" className="kg-btn kg-btn--gold kg-btn--sm">{authMode === "signin" ? "Sign In" : "Sign Up"}</button>
