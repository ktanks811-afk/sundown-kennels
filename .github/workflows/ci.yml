name: CI

# Runs on every push and pull request — catches syntax errors, runtime
# errors (via a real headless-browser playthrough), and Supabase schema
# mistakes before they ever reach a live deploy.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  syntax:
    name: JSX syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check:syntax

  smoke-test:
    name: Browser smoke test
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run check:smoke

  schema-check:
    name: Supabase schema check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Stub Supabase's roles and auth schema (not present in plain Postgres)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres <<'SQL'
          create extension if not exists pgcrypto;
          do $$ begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon; end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated; end if;
          end $$;
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key default gen_random_uuid());
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          create publication supabase_realtime;
          SQL
      - name: Apply supabase-schema.sql against a real Postgres instance
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase-schema.sql

      # supabase-schema.sql is the schema built from empty. The files in
      # migrations/ are what actually gets pasted into the live project, and
      # until now nothing checked them at all — which is how 001 and 002 sat
      # half-applied without anything going red.
      - name: Apply migrations/ in order, on their own database
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "create database migrated;"
          psql -h localhost -U postgres -d migrated -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key default gen_random_uuid());
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          SQL
          # The migrations assume the base schema already exists, the same way
          # the live project does.
          psql -h localhost -U postgres -d migrated -v ON_ERROR_STOP=1 -f supabase-schema.sql
          for f in migrations/*.sql; do
            echo "--- $f"
            psql -h localhost -U postgres -d migrated -v ON_ERROR_STOP=1 -f "$f"
          done

      # Every migration claims to be safe to run twice. This is the only way to
      # know that it is — and re-running is exactly what happens when someone
      # is unsure whether a paste went through the first time.
      - name: Re-run every migration to prove it is idempotent
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          for f in migrations/*.sql; do
            echo "--- $f (second run)"
            psql -h localhost -U postgres -d migrated -v ON_ERROR_STOP=1 -f "$f"
          done
